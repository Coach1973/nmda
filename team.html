<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

  <title>理監事團隊｜中華新媒體影音發展協會</title>
  <meta property="og:type" content="website">
  <meta property="og:title" content="理監事團隊｜中華新媒體影音發展協會">
  <meta property="og:description" content="認識為會員服務的理事與監事。">

  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@500;600;700;900&display=swap" rel="stylesheet">
  <style>
  :root{--bg:#f3efe6;--paper:#faf7f0;--ink:#171714;--muted:#6d6a62;--line:#cec7b9;--red:#b3221d;--dark:#171714;--cream:#f3efe6}
  *{box-sizing:border-box}html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:400 20px/1.7 "Noto Sans TC",sans-serif}
  a{color:inherit}img{max-width:100%;display:block}h1,h2,h3{font-family:"Noto Serif TC",serif;margin:0;line-height:1.2}
  .wrap{width:min(1180px,calc(100% - 40px));margin:auto}
  .top{position:sticky;top:0;z-index:20;background:rgba(243,239,230,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .top nav{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:20px}
  .brand{font-family:"Noto Serif TC";font-weight:900;text-decoration:none;font-size:20px;letter-spacing:.03em;line-height:1.3}
  .links{display:flex;gap:22px;align-items:center}.links a{text-decoration:none;font-weight:600}
  .btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 24px;background:var(--red);color:#fff;text-decoration:none;font:600 20px/1 "Noto Sans TC",sans-serif;border:1px solid var(--red);cursor:pointer;transition:.18s}
  .btn:hover{transform:translateY(-2px)}.btn.ghost{background:transparent;color:var(--red)}
  a:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid #1567a8;outline-offset:3px}
  .hero{background:var(--dark);color:var(--cream);padding:88px 0 80px}
  .kicker{letter-spacing:.16em;font-weight:600;color:#e7a6a3;margin:0 0 14px}
  .hero h1{font-size:clamp(44px,7vw,88px);letter-spacing:-.035em}.hero h1 em{font-style:normal;color:#e7a6a3}
  .hero .lead{max-width:680px;margin:26px 0 30px;color:#d9d5ca}
  .hero .count{margin-left:18px;color:#d9d5ca}
  .build{background:#fff3cd;color:var(--ink);padding:12px 16px;margin:0 0 24px;max-width:680px}
  section.team{padding:72px 0 24px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px}
  .card{background:var(--paper);border:1px solid var(--line);padding:26px;display:flex;flex-direction:column}
  .card .head{display:flex;gap:18px;align-items:center;margin-bottom:14px}
  .ph{width:96px;height:96px;border-radius:50%;object-fit:cover;object-position:50% 20%;flex:none;border:3px solid #eadfd0;background:#eadfd0;
      display:flex;align-items:center;justify-content:center;font:700 38px/1 "Noto Serif TC",serif;color:var(--red)}
  .role{display:inline-block;padding:0 12px;border:1px solid var(--red);color:var(--red);font-weight:600;margin-bottom:6px}
  .card h3{font-size:28px}.ct{color:var(--muted);margin:2px 0 0}
  .bio{white-space:pre-line;margin:0}
  details.bio-wrap summary{cursor:pointer;list-style:none}details.bio-wrap summary::-webkit-details-marker{display:none}
  details.bio-wrap .more{display:block;color:var(--red);font-weight:600;margin-top:4px}
  details.bio-wrap[open] .short{display:none}details.bio-wrap[open] .more{font-size:0}details.bio-wrap[open] .more::after{content:"收合";font-size:20px}
  .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:auto;padding-top:16px}
  .actions a.lnk{padding:2px 16px;border:1px solid var(--line);text-decoration:none}
  .actions form{margin:0;width:100%}.seat-btn{width:100%;min-height:48px;font:600 20px/1 "Noto Sans TC",sans-serif;background:none;color:var(--red);border:1.5px solid var(--red);cursor:pointer}
  .actions a.edit{background:var(--red);color:#fff;font-weight:600;padding:6px 18px;text-decoration:none}
  .card.seat{border-style:dashed;background:transparent}
  .state{color:var(--muted);padding:12px 0}
  .cta{margin:72px 0;padding:44px 28px;background:var(--paper);border:1px solid var(--line);text-align:center}
  .cta h2{font-size:clamp(28px,4vw,40px);margin-bottom:10px}.cta p{color:var(--muted);margin:0 0 22px}
  footer{padding:32px 0;background:var(--dark);color:#bdbab1}.foot{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}.foot a{color:#fff}
  @media(max-width:640px){.links a.hide-sm{display:none}.hero{padding:64px 0 56px}.hero .count{display:block;margin:14px 0 0}.brand small{display:none}}
  @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
  </style>
</head>
<body>
<header class="top"><nav class="wrap" aria-label="主要導覽"><a class="brand" href="./">中華新媒體影音發展協會</a><div class="links"><a class="hide-sm" href="./">協會首頁</a><a class="btn" href="https://event.bymyway.com/nmda/team/join">我要建立檔案</a></div></nav></header>
<main>
  <section class="hero"><div class="wrap">
    <p class="kicker">BOARD · 理監事團隊</p>
    <h1>為會員服務的<br><em>理事與監事</em></h1>
    <p class="lead">認識協會的理監事夥伴。名單上已有您的名字？點您那一張卡片的按鈕，自己補上照片、職稱與簡介，送出就上架。</p>
    <div id="build-note"></div>
    <a class="btn" href="https://event.bymyway.com/nmda/team/join">我要建立檔案</a><span class="count" id="count"></span>
  </div></section>
  <section class="team"><div class="wrap"><div class="grid" id="grid" aria-live="polite"><p class="state">名單載入中…</p></div></div></section>
  <div class="wrap"><div class="cta"><h2>您也是協會的理事或監事？</h2><p>填姓名、公司、簡介，附一張照片，3 分鐘完成，送出立刻上架。</p><a class="btn" href="https://event.bymyway.com/nmda/team/join">我要建立檔案</a></div></div>
</main>
<footer><div class="wrap foot"><span>© 2026 中華新媒體影音發展協會</span><span>全國性人民團體立案字號 1150028673</span><a href="./">回協會首頁</a><p class="credit-line" style="flex-basis:100%;margin:8px 0 0;font-size:20px"><a href="https://www.tava-ai.com/" target="_blank" rel="noopener">本網頁由 TAVA AI 製作</a>　<a href="https://www.bymyway.com/" target="_blank" rel="noopener">出品人 大樹教練</a>　<a href="https://event.bymyway.com/curated/rongtree/" target="_blank" rel="noopener">友善連結 榮樹下</a></p></div></footer>
<script>
(function(){
  /* 名單正本在 event.bymyway.com 的資料庫（NMDA 理監事團隊），這頁載入時讀 /api/nmda/team/board；資料只有一份，不要在這裡另存名單。 */
  var SITE='https://event.bymyway.com';
  var BUILD=(location.search.match(/[?&]build=([A-Za-z0-9]+)/)||[])[1]||'';   /* 教練的建置模式專屬連結：網址後面帶 ?build=簽章碼 */
  var grid=document.getElementById('grid');
  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}
  function safeUrl(u){return /^https?:\/\//i.test(u)?u:'#';}
  function photo(p){
    if(p.photo){var i=el('img','ph');i.src=p.photo;i.alt=p.name;i.loading='lazy';return i;}
    var s=el('span','ph',(p.name||'?').charAt(0));s.setAttribute('aria-hidden','true');return s;
  }
  function bio(text){
    if(text.length<=160)return el('p','bio',text);
    var d=el('details','bio-wrap'),sm=el('summary');
    sm.appendChild(el('span','short bio',text.slice(0,150)+'…'));sm.appendChild(el('span','more','看完整介紹'));
    d.appendChild(sm);d.appendChild(el('p','bio',text));return d;
  }
  function card(p){
    var c=el('article','card'+(p.filled?'':' seat'));
    var head=el('div','head'),box=el('div');
    head.appendChild(photo(p));
    if(p.role)box.appendChild(el('span','role',p.role));
    box.appendChild(el('h3',null,p.name));
    if(p.title)box.appendChild(el('p','ct',p.title));
    head.appendChild(box);c.appendChild(head);
    if(p.bio)c.appendChild(bio(p.bio));else if(!p.filled)c.appendChild(el('p','ct','簡介準備中'));
    var act=el('div','actions');
    (p.links||[]).forEach(function(l){var a=el('a','lnk',l.label);a.href=safeUrl(l.url);a.target='_blank';a.rel='noopener nofollow';act.appendChild(a);});
    if(BUILD&&p.edit){var e=el('a','edit','✏️ 編輯（上傳照片／簡介）');e.href=safeUrl(p.edit);act.appendChild(e);}
    else if(!p.filled&&p.id){
      var f=el('form');f.method='post';f.action=SITE+'/nmda/team/claim/'+(+p.id);
      var b=el('button','seat-btn','我是'+p.name+'，補上我的簡介');b.type='submit';f.appendChild(b);act.appendChild(f);
    }
    if(act.childNodes.length)c.appendChild(act);
    return c;
  }
  if(BUILD)document.getElementById('build-note').appendChild(el('p','build','🛠 建置模式（只有您看得到）：每張卡片都有「✏️ 編輯」，可以上傳照片、補職稱和簡介，也可以只補其中一項。'));
  fetch(SITE+'/api/nmda/team/board'+(BUILD?'?build='+BUILD:''),{cache:'no-store'}).then(function(r){return r.json();}).then(function(list){
    list=(list||[]).filter(function(p){return p&&typeof p.name==='string'&&p.name;});
    grid.textContent='';
    if(!list.length){grid.appendChild(el('p','state','理監事名單整理中，請稍後再來看看。'));return;}
    list.forEach(function(p){grid.appendChild(card(p));});
    var n=list.filter(function(p){return p.filled;}).length;
    document.getElementById('count').textContent='目前 '+n+' 位已上架・名單共 '+list.length+' 位';
  }).catch(function(){grid.textContent='';grid.appendChild(el('p','state','名單暫時載入不了，請稍後重新整理。'));});
})();
</script>
</body>
</html>
